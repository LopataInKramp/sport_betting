name: CI

on:
  push:
    #branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: "Debug: node & npm versions"
        run: |
          node --version
          npm --version

      - name: Install backend deps
        run: |
          cd backend
          npm ci

      - name: Run backend tests with coverage
        run: |
          cd backend
          npm test -- --coverage

      - name: Ensure backend coverage directory exists
        run: |
          if [ ! -d backend/coverage ]; then mkdir -p backend/coverage && echo "no-coverage" > backend/coverage/empty.txt; fi

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Run frontend tests with coverage
        run: |
          cd frontend
          npm test -- --coverage

      - name: Ensure frontend coverage directory exists
        run: |
          if [ ! -d frontend/coverage ]; then mkdir -p frontend/coverage && echo "no-coverage" > frontend/coverage/empty.txt; fi

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  sonarcloud:
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Download backend coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download frontend coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    quality-gate:
      runs-on: ubuntu-latest
      needs: [ sonarcloud ]
      steps:
        - name: SonarQube Quality Gate check
          uses: sonarsource/sonarqube-quality-gate-action@v5.0.0
          timeout-minutes: 5
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          with:
            scanMetadataReportFile: .scannerwork/report-task.txt