name: CI

on:
  push:
    #branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        run: |
          cd backend
          npm ci

      - name: Run backend tests with coverage
        run: |
          cd backend
          npm test -- --coverage

      - name: Ensure backend coverage directory exists
        run: |
          if [ ! -d backend/coverage ]; then mkdir -p backend/coverage && echo "no-coverage" > backend/coverage/empty.txt; fi

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Run frontend tests with coverage
        run: |
          cd frontend
          npm test -- --coverage

      - name: Ensure frontend coverage directory exists
        run: |
          if [ ! -d frontend/coverage ]; then mkdir -p frontend/coverage && echo "no-coverage" > frontend/coverage/empty.txt; fi

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-coverage
          path: frontend/coverage
